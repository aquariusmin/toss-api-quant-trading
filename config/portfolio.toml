# ===========================================================================
# 포트폴리오 배분 계획 (Portfolio plan)
#
# weight = 전체 자본 중 이 슬리브에 배정할 비중. 합계는 1.0 이하여야 하며,
# 남는 비중은 현금으로 보유합니다. (이 봇은 절대 레버리지/미수를 쓰지 않습니다)
#
# 왜 이런 배분인가:
#   토스 수수료는 국내 0.015% / 미국 0.10% + 환전 스프레드입니다.
#   즉 미국 종목은 왕복 약 50bp, 국내 ETF는 약 23bp가 듭니다.
#   회전율이 연 6회인 전략을 미국에 쓰면 매년 3%를 수수료로 잃습니다.
#   그래서 "자주 거래하는 전략"은 국내상장 ETF(S&P500·나스닥100 포함)에 쓰고,
#   미국 상장 슬리브는 거의 거래하지 않는 매수보유로만 씁니다.
#
# 백테스트로 확인하려면:  tqt backtest plan
# ===========================================================================

rebalance = "monthly"   # monthly | weekly

# --- 국내상장 글로벌 ETF + Faber 이동평균 타이밍 -----------------------------
# 2011~2026 백테스트: CAGR 5.7% / MDD -14.5% / Sharpe 0.92
# 수익률은 가장 낮지만 낙폭이 가장 얕습니다. 소액 검증 단계의 핵심 슬리브.
[[sleeve]]
key = "kr-global-etf"
strategy = "faber"
weight = 0.50
params = { sma_days = 200 }

# --- 같은 유니버스 + 듀얼 모멘텀 --------------------------------------------
# 2011~2026 백테스트: CAGR 7.6% / MDD -30.5% / Sharpe 0.53
# Faber와 신호가 달라 분산 효과가 있습니다. 낙폭이 크므로 비중은 절반.
[[sleeve]]
key = "kr-global-etf"
strategy = "dual-momentum"
weight = 0.25
params = { top_n = 2, lookback = 252 }

# --- 미국상장 ETF 매수보유 --------------------------------------------------
# 2011~2026 백테스트: CAGR 5.2% / MDD -25.9% / 회전율 연 0.12회
# 거래를 거의 안 하므로 미국 수수료(0.1%)와 환전 비용이 문제되지 않습니다.
[[sleeve]]
key = "us-global-etf"
strategy = "buy-and-hold"
weight = 0.25
params = { rebalance = "Y" }

# --- 참고: 아직 쓰지 않는 슬리브 --------------------------------------------
# us-sector    : 섹터 로테이션. dual-momentum CAGR 9.6%지만 MDD -33%, 비용 36%.
# kr-large-cap : 개별주 스윙. 매도 시 증권거래세 0.15% 추가 부담.
# 켜려면 weight를 주고 위 슬리브 비중을 그만큼 줄이세요.
